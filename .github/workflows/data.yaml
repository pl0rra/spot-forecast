name: data
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_data.py
      - run: python update_entsoe.py
        env:
          ENTSOE_TOKEN: ${{ secrets.ae20322e-347f-477c-b23f-5b7a7750a3c2 }}
      - name: Spara data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Uppdaterad data"
          git pull --rebase
          git push
