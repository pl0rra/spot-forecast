name: forecast
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python forecast.py
      - name: Spara resultat
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add forecast.json history/
          git diff --cached --quiet || git commit -m "Uppdaterad prognos"
          git push
