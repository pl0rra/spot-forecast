name: live
on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update_data.py
        continue-on-error: true
      - run: python update_entsoe.py
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      - run: python live.py
      - name: Spara resultat
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add forecast.json history/ data/
          git diff --cached --quiet || git commit -m "Uppdaterad prognos och data"
          git pull --rebase
          git push
